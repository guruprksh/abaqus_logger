[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus_logger"
version = "0.1.0"
description = "Simple table-style text logger for Abaqus and post-processing scripts"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "guruprksh"}]
requires-python = ">=3.6"
dependencies = []
keywords = ["abaqus", "logging", "fem", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/guruprksh/abaqus_logger"
Issues = "https://github.com/guruprksh/abaqus_logger/issues"

[tool.setuptools]
py-modules = ["abaqus_logger"]
